<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUS Physics Club - Tạo Avatar Frame</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      min-height: 100vh;
    }
    h2 { margin-bottom: 6px; text-align: center; color: #38bdf8; font-size: 20px; }
    p.guide { font-size: 13px; color: #94a3b8; margin-bottom: 18px; text-align: center; }
    
    /* Vùng hiển thị khung chỉnh sửa */
    .editor-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    @media (min-width: 450px) {
      .editor-wrapper { width: 380px; height: 380px; }
    }

    #cropper-target {
      display: block;
      max-width: 100%;
    }

    /* Khung viền đè lên trên, chuột xuyên qua để chỉnh ảnh dưới */
    .frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      object-fit: cover;
    }

    /* Ẩn các viền mờ mặc định của thư viện để nhìn rõ frame */
    .cropper-view-box {
      outline: none !important;
    }
    .cropper-modal {
      opacity: 0.1 !important;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-upload { background: #0284c7; color: #fff; }
    .btn-upload:hover { background: #0369a1; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <h2>TẠO AVATAR KHUNG SỰ KIỆN</h2>
  <p class="guide">Dùng ngón tay/chuột kéo, xoay hoặc thu nhỏ ảnh cho vừa khít hình tròn</p>

  <div class="editor-wrapper">
    <img id="cropper-target" src="" style="display: none;">
    <img class="frame-overlay" id="frame-view" src="frame.png" alt="Frame">
  </div>

  <div class="controls">
    <label class="btn btn-upload">
      📁 Tải ảnh khác lên
      <input type="file" id="imageInput" accept="image/*">
    </label>

    <button class="btn btn-download" id="downloadBtn" style="display: none;">
      💾 Tải ảnh hoàn chỉnh (1080x1080)
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const imageInput = document.getElementById('imageInput');
    const cropperTarget = document.getElementById('cropper-target');
    const downloadBtn = document.getElementById('downloadBtn');
    let cropper = null;

    const OUTPUT_SIZE = 1080;

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        cropperTarget.src = event.target.result;
        cropperTarget.style.display = 'block';

        if (cropper) cropper.destroy();

        cropper = new Cropper(cropperTarget, {
          aspectRatio: 1,
          viewMode: 0, // Cho phép kéo và thu nhỏ tự do ra ngoài viền
          dragMode: 'move',
          autoCropArea: 1,
          restore: false,
          guides: false,
          center: false,
          highlight: false,
          cropBoxMovable: false,
          cropBoxResizable: false,
          toggleDragModeOnDblclick: false,
          ready: function () {
            downloadBtn.style.display = 'inline-flex';
          }
        });
      };
      reader.readAsDataURL(file);
    });

    downloadBtn.addEventListener('click', function() {
      if (!cropper) return;

      // 1. Cắt chính xác khung vuông 1080x1080 (loại bỏ mọi phần lòi ra ngoài)
      const croppedCanvas = cropper.getCroppedCanvas({
        width: OUTPUT_SIZE,
        height: OUTPUT_SIZE,
        fillColor: '#002b49', // Nền phụ đề phòng ảnh nhỏ hơn khung
        imageSmoothingQuality: 'high'
      });

      // 2. Tạo Canvas để đè Frame lên
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = OUTPUT_SIZE;
      finalCanvas.height = OUTPUT_SIZE;
      const ctx = finalCanvas.getContext('2d');

      // Vẽ ảnh chân dung đã căn chỉnh
      ctx.drawImage(croppedCanvas, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

      // Vẽ Frame đè lên
      const frameImg = new Image();
      frameImg.crossOrigin = "anonymous";
      frameImg.src = 'frame.png';
      frameImg.onload = function() {
        ctx.drawImage(frameImg, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

        const link = document.createElement('a');
        link.download = 'avatar-hus-physics.png';
        link.href = finalCanvas.toDataURL('image/png');
        link.click();
      };
    });
  </script>
</body>
</html>
